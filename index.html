<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0a08;
      color: #f1eadc;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 2rem;
    }

    main {
      max-width: 720px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }

    p {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.6;
      opacity: 0.82;
    }

    .small {
      margin-top: 2rem;
      font-size: 0.95rem;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <main>
    <h1>Marginalia</h1>
    <p>A quiet place for readers to remember what moved them.</p>
    <p class="small">readmarginalia.org</p>
  </main>
</body>
</html>
