<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0a08;
      color: #f1eadc;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 2rem;
    }

    main {
      max-width: 720px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }

    p {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.6;
      opacity: 0.82;
    }

    .opening {
      margin-top: 1.5rem;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    form {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input {
      background: transparent;
      border: 1px solid rgba(241, 234, 220, 0.35);
      color: #f1eadc;
      padding: 0.85rem 1rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      min-width: 260px;
    }

    input::placeholder {
      color: rgba(241, 234, 220, 0.45);
    }

    button {
      background: #f1eadc;
      color: #0b0a08;
      border: none;
      padding: 0.85rem 1.1rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      cursor: pointer;
    }

    .small {
      margin-top: 2rem;
      font-size: 0.95rem;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <main>
    <h1>Marginalia</h1>
    <p>A quiet place for readers to remember what moved them.</p>
    <p class="opening">Opening soon</p>

    <form>
      <input type="email" placeholder="Your email address" required />
      <button type="submit">Notify Me When Opened</button>
    </form>

    <p class="small">readmarginalia.org</p>
  </main>
</body>
</html>
