<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#E8DEC5;}
body{
  font-family:'EB Garamond',Georgia,serif;
  color:#2B2117;
  background:radial-gradient(120% 85% at 50% 16%,#F6EFDB 0%,#EAE0C8 64%,#E1D5BA 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:48px 24px;
}
::selection{background:rgba(154,123,63,0.22);}
@keyframes mgFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

main{position:relative;z-index:1;max-width:640px;animation:mgFade 1.2s ease both;}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:clamp(40px,7vw,58px);line-height:1.08;color:#2B2117;
}
.rule-line{width:64px;height:1px;background:#9A7B3F;margin:30px auto 28px;}
p{font-size:clamp(18px,2.4vw,21px);line-height:1.7;color:#5A4C37;}
a{
  display:inline-block;margin-top:40px;font-size:13px;letter-spacing:0.28em;
  text-transform:uppercase;color:#9A7B3F;text-decoration:none;
  border-bottom:1px solid #9A7B3F;padding:6px 2px;transition:opacity .4s ease;
}
a:hover{opacity:0.62;}

/* Shared antiquarian motifs (canon continuity) */
.shelf{position:fixed;top:0;bottom:0;width:210px;z-index:0;pointer-events:none;opacity:.5;
  background-repeat:repeat-y;background-position:top center;background-size:210px auto;}
.shelf::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,210,140,.14), rgba(255,210,140,.05) 42%, rgba(255,210,140,.13));
  mix-blend-mode:screen;}
.shelf-left{left:0;
  -webkit-mask-image:linear-gradient(to right,#000 0%,#000 30%,transparent 100%);
          mask-image:linear-gradient(to right,#000 0%,#000 30%,transparent 100%);}
.shelf-right{right:0;
  -webkit-mask-image:linear-gradient(to left,#000 0%,#000 30%,transparent 100%);
          mask-image:linear-gradient(to left,#000 0%,#000 30%,transparent 100%);}
@media (max-width:860px){ .shelf{display:none;} }

#metatron{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(92vw,860px);height:min(92vw,860px);max-height:94vh;
  z-index:0;pointer-events:none;opacity:.06;}
#metatron svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>

<div class="shelf shelf-left" aria-hidden="true"></div>
<div class="shelf shelf-right" aria-hidden="true"></div>
<div id="metatron" aria-hidden="true"></div>

<main>
  <h1>Page Bookmarked</h1>
  <div class="rule-line"></div>
  <p>You&rsquo;ll be here when the pages turn.</p>
  <a href="/">Return to Marginalia</a>
</main>

<script>
  (function buildMetatron(){
    const el = document.getElementById('metatron');
    if(!el) return;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','-10 -10 20 20');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    const r = 2.2, R1 = 2*r, R2 = 2*r*Math.sqrt(3);
    const pts = [[0,0]];
    let i, j, a;
    for(i=0;i<6;i++){ a = Math.PI/180*(60*i); pts.push([R1*Math.cos(a), R1*Math.sin(a)]); }
    for(i=0;i<6;i++){ a = Math.PI/180*(30+60*i); pts.push([R2*Math.cos(a), R2*Math.sin(a)]); }
    const g = document.createElementNS(NS,'g');
    g.setAttribute('fill','none'); g.setAttribute('stroke','#9A7B3F'); g.setAttribute('stroke-width','0.04');
    for(i=0;i<pts.length;i++){
      for(j=i+1;j<pts.length;j++){
        const ln = document.createElementNS(NS,'line');
        ln.setAttribute('x1',pts[i][0].toFixed(3)); ln.setAttribute('y1',pts[i][1].toFixed(3));
        ln.setAttribute('x2',pts[j][0].toFixed(3)); ln.setAttribute('y2',pts[j][1].toFixed(3));
        g.appendChild(ln);
      }
    }
    for(i=0;i<pts.length;i++){
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx',pts[i][0].toFixed(3)); c.setAttribute('cy',pts[i][1].toFixed(3)); c.setAttribute('r',r.toFixed(3));
      g.appendChild(c);
    }
    svg.appendChild(g); el.appendChild(svg);
  })();

  // Procedural bookcase, painted onto the side panels
  (function paintShelves(){
    function makeShelfSVG(){
      const W=210, rowH=188, rows=9, H=rowH*rows, board=12, topGap=10;
      const spines=['#6e4b34','#7c5a3d','#8a6a3a','#5a4a36','#4f4636','#79503e','#b29a5f',
                    '#67563d','#834f3a','#6c5a40','#9A7B3F','#5e6b4f','#73403a','#475240','#8c5a3a','#a98b50'];
      const r=(a,b)=>a+Math.random()*(b-a);
      const pick=a=>a[Math.floor(Math.random()*a.length)];
      const f=n=>Math.round(n*10)/10;
      let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
      s+='<rect width="'+W+'" height="'+H+'" fill="#2e2110"/>';
      for(let row=0;row<rows;row++){
        const rowTop=row*rowH, boardY=rowTop+rowH-board, avail=boardY-(rowTop+topGap);
        let x=r(2,6);
        while(x<W-6){
          if(Math.random()<0.05){ x+=r(6,16); continue; }
          let bw=r(12,30); if(x+bw>W-4) bw=W-4-x; if(bw<8) break;
          const bh=avail*r(0.7,0.99), by=boardY-bh, col=pick(spines);
          s+='<rect x="'+f(x)+'" y="'+f(by)+'" width="'+f(bw)+'" height="'+f(bh)+'" rx="1.5" fill="'+col+'"/>';
          s+='<rect x="'+f(x)+'" y="'+f(by)+'" width="'+f(bw*0.16)+'" height="'+f(bh)+'" fill="#ffffff" opacity="0.10"/>';
          s+='<rect x="'+f(x+bw*0.74)+'" y="'+f(by)+'" width="'+f(bw*0.26)+'" height="'+f(bh)+'" fill="#000000" opacity="0.18"/>';
          if(Math.random()<0.45){
            const b1=by+bh*r(0.16,0.26);
            s+='<rect x="'+f(x+1)+'" y="'+f(b1)+'" width="'+f(bw-2)+'" height="2" fill="#caa65f" opacity="0.8"/>';
            if(Math.random()<0.6) s+='<rect x="'+f(x+1)+'" y="'+f(b1+5)+'" width="'+f(bw-2)+'" height="1.4" fill="#caa65f" opacity="0.55"/>';
          }
          x+=bw+r(0.5,2.2);
        }
        s+='<rect x="0" y="'+f(boardY)+'" width="'+W+'" height="'+board+'" fill="#241809"/>';
        s+='<rect x="0" y="'+f(boardY)+'" width="'+W+'" height="2" fill="#5a3f24"/>';
        s+='<rect x="0" y="'+f(boardY+board)+'" width="'+W+'" height="3" fill="#000000" opacity="0.22"/>';
      }
      s+='</svg>';
      return s;
    }
    document.querySelectorAll('.shelf').forEach(function(el){
      el.style.backgroundImage = "url('data:image/svg+xml;utf8," + encodeURIComponent(makeShelfSVG()) + "')";
    });
  })();
</script>

</body>
</html>
