<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0a08;
      color: #f1eadc;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 2rem;
    }

    main {
      max-width: 700px;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 400;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.8;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      color: #f1eadc;
      text-decoration: none;
      border-bottom: 1px solid rgba(241, 234, 220, 0.4);
    }
  </style>
</head>
<body>
  <main>
    <h1>Page Bookmarked</h1>
    <p>You’ll be here when the pages turn.</p>

    <a href="/">Return to Marginalia</a>
  </main>
</body>
</html>
