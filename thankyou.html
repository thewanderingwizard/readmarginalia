<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#E8DEC5;}
body{
  font-family:'EB Garamond',Georgia,serif;
  color:#2B2117;
  background:radial-gradient(120% 85% at 50% 16%,#F6EFDB 0%,#EAE0C8 64%,#E1D5BA 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:48px 24px;
}
::selection{background:rgba(154,123,63,0.22);}
@keyframes mgFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

main{position:relative;z-index:1;max-width:640px;animation:mgFade 1.2s ease both;}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:clamp(40px,7vw,58px);line-height:1.08;color:#2B2117;
}
.rule-line{width:64px;height:1px;background:#9A7B3F;margin:30px auto 28px;}
p{font-size:clamp(18px,2.4vw,21px);line-height:1.7;color:#5A4C37;}
a{
  display:inline-block;margin-top:40px;font-size:13px;letter-spacing:0.28em;
  text-transform:uppercase;color:#9A7B3F;text-decoration:none;
  border-bottom:1px solid #9A7B3F;padding:6px 2px;transition:opacity .4s ease;
}
a:hover{opacity:0.62;}

/* Shared antiquarian motifs (canon continuity) */
.shelf{position:fixed;top:0;bottom:0;width:210px;z-index:0;pointer-events:none;opacity:.3;}
.shelf::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 58% at 50% 13%, rgba(255,214,150,.4), rgba(255,214,150,0) 62%);}
.shelf-left{left:0;
  background:
    repeating-linear-gradient(0deg, rgba(58,38,22,0) 0 128px, rgba(58,38,22,.65) 128px 138px),
    repeating-linear-gradient(90deg,
      #6e4b34 0 13px,#7c5a3d 13px 25px,#5a4a36 25px 33px,#8a6a3a 33px 48px,
      #4f4636 48px 58px,#79503e 58px 72px,#b29a5f 72px 84px,#67563d 84px 99px,
      #834f3a 99px 112px,#6c5a40 112px 126px);
  -webkit-mask-image:linear-gradient(to right,#000 0%,#000 26%,transparent 100%);
          mask-image:linear-gradient(to right,#000 0%,#000 26%,transparent 100%);}
.shelf-right{right:0;
  background:
    repeating-linear-gradient(0deg, rgba(58,38,22,0) 0 128px, rgba(58,38,22,.65) 128px 138px),
    repeating-linear-gradient(90deg,
      #6c5a40 0 13px,#834f3a 13px 26px,#67563d 26px 34px,#b29a5f 34px 46px,
      #79503e 46px 60px,#4f4636 60px 70px,#8a6a3a 70px 85px,#5a4a36 85px 93px,
      #7c5a3d 93px 107px,#6e4b34 107px 122px);
  -webkit-mask-image:linear-gradient(to left,#000 0%,#000 26%,transparent 100%);
          mask-image:linear-gradient(to left,#000 0%,#000 26%,transparent 100%);}
@media (max-width:860px){ .shelf{display:none;} }

#metatron{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(92vw,860px);height:min(92vw,860px);max-height:94vh;
  z-index:0;pointer-events:none;opacity:.06;}
#metatron svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>

<div class="shelf shelf-left" aria-hidden="true"></div>
<div class="shelf shelf-right" aria-hidden="true"></div>
<div id="metatron" aria-hidden="true"></div>

<main>
  <h1>Page Bookmarked</h1>
  <div class="rule-line"></div>
  <p>You&rsquo;ll be here when the pages turn.</p>
  <a href="/">Return to Marginalia</a>
</main>

<script>
  (function buildMetatron(){
    const el = document.getElementById('metatron');
    if(!el) return;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','-10 -10 20 20');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    const r = 2.2, R1 = 2*r, R2 = 2*r*Math.sqrt(3);
    const pts = [[0,0]];
    let i, j, a;
    for(i=0;i<6;i++){ a = Math.PI/180*(60*i); pts.push([R1*Math.cos(a), R1*Math.sin(a)]); }
    for(i=0;i<6;i++){ a = Math.PI/180*(30+60*i); pts.push([R2*Math.cos(a), R2*Math.sin(a)]); }
    const g = document.createElementNS(NS,'g');
    g.setAttribute('fill','none'); g.setAttribute('stroke','#9A7B3F'); g.setAttribute('stroke-width','0.04');
    for(i=0;i<pts.length;i++){
      for(j=i+1;j<pts.length;j++){
        const ln = document.createElementNS(NS,'line');
        ln.setAttribute('x1',pts[i][0].toFixed(3)); ln.setAttribute('y1',pts[i][1].toFixed(3));
        ln.setAttribute('x2',pts[j][0].toFixed(3)); ln.setAttribute('y2',pts[j][1].toFixed(3));
        g.appendChild(ln);
      }
    }
    for(i=0;i<pts.length;i++){
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx',pts[i][0].toFixed(3)); c.setAttribute('cy',pts[i][1].toFixed(3)); c.setAttribute('r',r.toFixed(3));
      g.appendChild(c);
    }
    svg.appendChild(g); el.appendChild(svg);
  })();
</script>
</body>
</html>
